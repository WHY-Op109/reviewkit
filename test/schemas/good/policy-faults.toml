# ReviewKit schema test instance (data format v0); toy names only.
format = "reviewkit-policy-faults/0"

[[case]]
name = "extras: an id that is no graph node"
kind = "fault"
command = "extras"
dir = "extras-stale"
args = ["--graph", "graph.json", "--extras", "extras.toml"]
[[case.expect]]
code = "extras-stale-id"
decl = "X.y"
[[case.expect]]
code = "extras-key-outside-closure"
file = "extras.toml"
severity = "warning"

[[case]]
name = "extras: the clean file passes"
kind = "control"
stdin = ""
command = "extras"
dir = "extras-clean"
args = ["--graph", "graph.json"]
