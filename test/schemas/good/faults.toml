# ReviewKit schema test instance (data format v0); toy names only.
format = "reviewkit-faults/0"

[[case]]
name = "clean toy passes"
kind = "control"
command = "all"
[[case.key]]
decl = "RKToy.Abstract.Curve"
tag = "abstract"

[[case]]
name = "pin: a swapped object"
modules = ["RKToy.Bad.Swap"]
command = "pin"
pin = "test/reviews/swap-pin.toml"
pin_decls = ["RKToy.Bad.Swap.mainA"]
orders = ["forward", "reverse"]
[[case.stand_in]]
decl = "RKToy.Bad.Swap.mainB"
for = "RKToy.Bad.Swap.mainA"
[[case.expect]]
code = "pin-mismatch"
decl = "RKToy.Bad.Swap.mainA"

[[case]]
name = "fingerprints tell two opaques apart"
kind = "fpcompare"
modules = ["RKToy.Bad.Opaques"]
[[case.compare]]
a = "RKToy.Bad.Opaques.f"
b = "RKToy.Bad.Opaques.g"
level = "statement"
same = false
