# ReviewKit schema test instance (data format v0); toy names only.
format = "reviewkit-config/0"

[project]
import = ["RKToy"]
modules = ["RKToy"]
abstract = "RKToy.Abstract"

[closure]
background = ["Init", "Std", "Lean", "ReviewKit"]
[[closure.class]]
tag = "abstract"
modules = ["RKToy.Abstract"]
[[closure.class]]
tag = "foundations"
modules = ["RKToy.Foundations"]

[axioms]
allowed = ["propext", "Classical.choice", "Quot.sound"]
budget = "test/reviews/sorry-budget.toml"

[[imports.rule]]
module = "RKToy.Abstract"
allow = ["Init", "RKUp", "RKToy.Foundations"]
[[imports.rule]]
module = "RKToy"
allow = ["Init", "RKToy"]

[foundations_names]
foundations = ["RKToy.Foundations"]
checked = ["RKUp"]
required = ["RKUp.Thing"]
basic = []

[fingerprint]
content = ["RKToy", "RKUp"]
unfold_abbrevs = ["RKToy.Foundations"]
notations = ["GT.gt", "GE.ge"]

[pin]
file = "test/reviews/statement-pin.toml"
decls = ["RKToy.Abstract.main"]

[placeholders]
modules = ["RKToy"]

[evidence]
dir = "evidence"

[attestations]
file = "reviews/attestations.toml"

[extras]
file = "extras.toml"
providers = ["upstream", "placeholder", "abstract"]
require_provider = true

[tracker]
plans = "plans"
roots = ["RKToy"]

[owned]
owners = ["example-owner"]
paths = ["/.github/", "/reviews/", "/project.toml"]
codeowners = ".github/CODEOWNERS"

[flagged]
flags = ["key", "chain"]
plan_fields = ["desc", "description", "source", "kind", "deps", "wrong", "deprecated"]

[pin_policy]
package = "RKUp"
lakefile = "lakefile.toml"
manifest = "lake-manifest.json"
toolchain = "lean-toolchain"
extra_toolchains = ["sub/lean-toolchain"]

[papers]
manifest = "references/manifest.toml"

[scout]
watched = ["RKUp/Thing"]

[upstream]
RKUp = { rev = "v1.0.0", commit = "v1.0.0", policy = "tags only" }
cache_service = "example-cache"
