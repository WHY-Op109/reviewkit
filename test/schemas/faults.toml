# ReviewKit schema fixtures (K3, data format v0), format reviewkit-policy-faults/0, run by
#   python3 -I reviewkit/scripts/rk_faults.py reviewkit/test/schemas/faults.toml
# Every case runs `rk_schema.py <args>` in this directory. Each bad instance carries a planted
# defect and must give schema-invalid in its own file and no other error; every good instance is
# a control. Toy names only (no project data, D35). The instances in good/, bad/ and misc/ and
# the lint-*/ schemas were generated in stage A2 (2026-11-06) by Claude Opus 5.5; unreviewed.
format = "reviewkit-policy-faults/0"

