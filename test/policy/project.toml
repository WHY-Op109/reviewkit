# A generic toy configuration for the Python policy checks (reviewkit/scripts/rk_*.py), used by
# test/policy/faults.toml. It names no real project (D35); the A1 tables read only by
# `lake exe review` are left out (see test/project.toml for them).
#   python3 -I reviewkit/scripts/rk_faults.py reviewkit/test/policy/faults.toml
format = "reviewkit-config/0"

[project]                               # required by the config schema; unused here
import = ["Toy"]
abstract = "Toy.Abstract"

[evidence]
dir = "evidence"

[attestations]
file = "reviews/attestations.toml"

[extras]
file = "extras.toml"
providers = ["lib", "local", "placeholder"]
require_provider = true

[tracker]
plans = "plans"
roots = ["Toy"]

[owned]
owners = ["toy-owner"]
paths = ["/.github/", "/POLICY.md", "/kit/", "/build.toml", "/vendor/sub"]
codeowners = ".github/CODEOWNERS"

[flagged]
flags = ["key", "chain"]
plan_fields = ["desc", "description", "source", "kind", "deps", "wrong", "deprecated"]

[pin_policy]
package = "UpstreamLib"
lakefile = "lakefile.toml"
manifest = "lake-manifest.json"
toolchain = "lean-toolchain"
extra_toolchains = ["kit/lean-toolchain"]

[upstream]
# matched case-insensitively against pin_policy.package
upstreamlib = { rev = "v1.2.0", commit = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", policy = "tags" }
