name = "flagged: an unchanged head with extra flags from --flags-root"
kind = "control"
command = "flagged"
dir = "flagged"
args = ["--config", "../project.toml", "--base-root", "mb-unflagged", "--head-root",
  "mb-unflagged", "--flags-root", "base"]

[[case]]
name = "flagged: the provider and hypotheses of a flagged extras entry edited"
kind = "fault"
command = "flagged"
dir = "flagged"
args = ["--config", "../project.toml", "--base-root", "base", "--head-root", "head-entry-edited"]
[[case.expect]]
code = "flagged-entry-edited"
decl = "Toy.A.bar"

[[case]]
name = "snapshot: a node that rose while newly deprecated is not progress"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "deprecated-progress.json"]
[[case.expect]]
code = "snapshot-no-progress"
severity = "warning"
[[case.expect]]
code = "snapshot-deprecated-new"
decl = "Toy.A.bar"
severity = "info"

[[case]]
name = "snapshot: a node in state wrong counts as wrong even when its wrong field says false"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "wrong-no-flag.json"]
[[case.expect]]
code = "snapshot-wrong-new"
decl = "Toy.A.bar"
severity = "info"

# --- lean-exec: Lean code that runs at build or import time (CI builds the PR) -----------------

[[case]]
name = "lean-exec: plain definitions, an attribute that runs nothing, a deleted file (control)"
kind = "control"
command = "lean-exec"
dir = "leanexec"
args = ["--config", "../project.toml", "--root", "tree", "--changed-files", "changed-clean.txt",
  "--author", "toy-agent[bot]"]

[[case]]
name = "lean-exec: an agent adds an initialiser"
