# --- snapshots (rk_snapshot.py) -------------------------------------------------------------

[[case]]
name = "snapshot: take writes a snapshot"
kind = "control"
command = "snapshot"
dir = "snapshot"
args = ["take", "--graph", "graph-old.json", "--out", "/dev/null"]

[[case]]
name = "snapshot: a planned node rose (progress)"
kind = "control"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "graph-progress.json"]
[[case.expect]]
code = "snapshot-progress"
decl = "Toy.B.baz"
severity = "info"

[[case]]
name = "snapshot: only a new plan node and a deprecation (no progress)"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "graph-none.json"]
[[case.expect]]
code = "snapshot-no-progress"
severity = "warning"
[[case.expect]]
code = "snapshot-added"
decl = "Toy.B.new"
severity = "info"
[[case.expect]]
code = "snapshot-deprecated-new"
decl = "Toy.B.old"
severity = "info"

[[case]]
name = "snapshot: a wrong mark is not progress"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "graph-wrong.json"]
[[case.expect]]
code = "snapshot-no-progress"
severity = "warning"
[[case.expect]]
code = "snapshot-wrong-new"
decl = "Toy.A.bar"
severity = "info"

[[case]]
name = "snapshot: a removed plan node is not progress"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "graph-none.json", "old.json"]
[[case.expect]]
code = "snapshot-no-progress"
severity = "warning"
[[case.expect]]
code = "snapshot-removed"
decl = "Toy.B.new"
severity = "info"

[[case]]
name = "snapshot: a planned node fell (regression)"
kind = "fault"
command = "snapshot"
dir = "snapshot"
args = ["compare", "old.json", "graph-regression.json"]
[[case.expect]]
code = "snapshot-regression"
decl = "Toy.A.bar"
severity = "warning"

